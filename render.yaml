services:
  - type: web
    name: slideforge-design-server
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MAX_UPLOAD_MB
        value: "64"
      - key: MAX_CONCURRENT_CONVERSIONS
        value: "1"
      - key: RENDER_DPI
        value: "120"
